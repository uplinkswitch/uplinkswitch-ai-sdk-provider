# Publishes the package to npm when a version tag is pushed (v0.1.0 and so on). No secret: npm's trusted
# publishing (OIDC) trusts this repository and this workflow file, configured once on npmjs.com for the
# package, so the job needs only `id-token: write` and npm 11.5.1 or later. Provenance is attached
# automatically. The version in package.json must match the tag.
name: Publish to npm
on:
  push:
    tags:
      - "v*"
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Check the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          test "$tag" = "$version" || { echo "tag v$tag does not match package.json version $version"; exit 1; }
      - run: npm publish --access public
